name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: source_read_app
        name: Create source-read GitHub App token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: contracts
          permission-contents: read
      - name: Configure private Go modules
        env:
          SOURCE_TOKEN: ${{ steps.source_read_app.outputs.token }}
        run: |
          set -euo pipefail
          echo 'GOPRIVATE=github.com/envpilot/*' >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/envpilot-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Use published contracts module
        run: go mod edit -dropreplace=github.com/envpilot/contracts
      - name: Download private modules before running repository code
        run: go mod download
      - name: Remove source credentials before tests
        if: always()
        run: rm -f "$RUNNER_TEMP/envpilot-gitconfig"
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
      - run: go test ./...
      - name: Enforce public notification boundary
        run: test -f notify/notifier.go
      - name: Enforce public SCM parser boundary
        run: test -f scm/scm.go && test -f docs/module-ownership.md
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
