name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Go toolchain
        run: |
          GO_VERSION_FILE=go.mod \
          ./scripts/ensure-go.sh
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: webhook-go-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            webhook-go-cache-${{ runner.os }}-
      - name: Use published contracts module
        run: |
          go mod edit -dropreplace=github.com/envpilot/contracts
          go mod tidy
      - name: Download modules before running repository code
        run: go mod download
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test ./...
      - name: Enforce public notification boundary
        run: test -f notify/notifier.go
      - name: Enforce public SCM parser boundary
        run: test -f scm/scm.go && test -f docs/module-ownership.md
      - run: go vet ./...
      - name: Lint Go code
        run: scripts/golangci-lint.sh
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
